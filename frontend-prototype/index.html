<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Grievance Portal — JUIT Solan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Background decoration layer -->
  <div class="bg-layer">
  <span class="bg-dot" style="width:8px;height:8px;background:#4361ee;opacity:.2;top:9%;left:55%;"></span>
  <span class="bg-dot" style="width:6px;height:6px;background:#f59f00;opacity:.3;top:25%;left:12%;"></span>
  <span class="bg-dot" style="width:9px;height:9px;background:#56cfee;opacity:.25;top:60%;right:9%;"></span>
  <span class="bg-dot" style="width:5px;height:5px;background:#f03e3e;opacity:.25;top:75%;left:48%;"></span>
  <span class="bg-dot" style="width:7px;height:7px;background:#06b77e;opacity:.22;bottom:18%;left:28%;"></span>
  <span class="bg-dot" style="width:60px;height:60px;border:1px solid rgba(67,97,238,.08);border-radius:50%;top:15%;right:22%;"></span>
  <span class="bg-dot" style="width:40px;height:40px;border:1px solid rgba(86,207,238,.1);border-radius:50%;bottom:28%;left:18%;"></span>
</div>

<div id="root"></div>


  <!-- App -->
  <script type="text/babel" src="app.js"></script>

</body>
</html>
